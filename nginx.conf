# ==============================================================================
# CRESTON PREMIUM COLLECTIONS - Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/creston and symlink to /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name creston.co.ke www.creston.co.ke;

    # Redirect all HTTP traffic to HTTPS (uncomment after running certbot)
    # return 301 https://$host$request_uri;

    # Maximum upload file size for clothing product photos
    client_max_body_size 16M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|webp|gif|svg|ico)$ {
        root /var/www/creston/public;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri @backend;
    }

    # API and Dynamic Application Routing
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for responsive checkout and M-Pesa STK push handling
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

